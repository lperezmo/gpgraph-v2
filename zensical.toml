[project]
site_name = "gpgraph-v2"
site_description = "NetworkX-backed, Rust-accelerated graphs over genotype-phenotype maps."
site_url = "https://lperezmo.github.io/gpgraph-v2/"
repo_url = "https://github.com/lperezmo/gpgraph-v2"
repo_name = "lperezmo/gpgraph-v2"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
nav = [
    { "Home" = "index.md" },
    { "Quickstart" = "quickstart.md" },
    { "Installation" = "installation.md" },
    { "Concepts" = [
        { "Graph model" = "concepts/graph-model.md" },
        { "Neighbors" = "concepts/neighbors.md" },
        { "Fixation models" = "concepts/fixation-models.md" },
    ] },
    { "Guides" = [
        { "Forward paths and flux" = "guides/forward-paths.md" },
        { "Plotting" = "guides/plotting.md" },
    ] },
    { "Reference" = [
        { "GenotypePhenotypeGraph" = "reference/graph.md" },
        { "Fixation models" = "reference/fixation.md" },
        { "Neighbors" = "reference/neighbors.md" },
        { "Paths" = "reference/paths.md" },
        { "pyplot" = "reference/pyplot.md" },
        { "Exceptions" = "reference/exceptions.md" },
        { "Changelog" = "reference/changelog.md" },
    ] },
]

[project.theme]
variant = "modern"
features = [
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.top",
    "navigation.footer",
    "navigation.indexes",
    "navigation.tracking",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"
